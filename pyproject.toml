[project]
name = "note-downloader"
version = "0.1.0"
description = "Downloader for Note articles to Markdown"
authors = [
    { name = "Fujinami", email = "your.email@example.com" }
]
dependencies = [
    "beautifulsoup4>=4.12.0",
]
requires-python = ">=3.8"

[project.scripts]
note-dl = "note_downloader.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
